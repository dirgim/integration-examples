apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: integration-resolver-pipeline-pass
spec:
  params:
    - name: SNAPSHOT
      type: string
  tasks:
    - name: task-success
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/integration-examples 
          - name: revision
            value: main
          - name: pathInRepo
            value: tasks/test_output.yaml
      params:
        - name: RESULT
          value: SUCCESS
    - name: test-snapshot
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/dirgim/integration-examples
          - name: revision
            value: STONEINTG-1469
          - name: pathInRepo
            value: tasks/test_snapshot.yaml
      params:
        - name: SNAPSHOT
          value: $(params.SNAPSHOT)
